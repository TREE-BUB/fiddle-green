<section class="band band--cta">
  <div class="band--cta__text">
    <h2>{{ include.title | escape_once }}</h2>
    <p>{{ include.body | escape_once }}</p>
  </div>
  {%- if include.secondary_url -%}
    <div class="band--cta__actions">
      <a class="btn btn--amber" href="{{ include.url | default: '/contact/' | relative_url }}">{{ include.label | default: 'Start a conversation' }}</a>
      <a class="btn btn--ghost" href="{{ include.secondary_url | relative_url }}">{{ include.secondary_label }}</a>
    </div>
  {%- else -%}
    <a class="btn btn--amber btn--nowrap" href="{{ include.url | default: '/contact/' | relative_url }}">{{ include.label | default: 'Start a conversation' }}</a>
  {%- endif -%}
</section>
