# One build, two destinations.
#
#   push to the staging branch -> commit _site/ so Cloudflare serves it
#   push to main               -> deploy the same output to GitHub Pages
#
# Cloudflare (wrangler.jsonc) uploads _site/ as static files and never builds,
# so the committed output is what visitors get. Without this workflow a source
# edit made through the GitHub web UI leaves _site/ stale: new pages go
# missing and deleted ones stay live.
#
# If the staging branch is ever renamed, update the branch list below.

name: Build site

on:
  push:
    branches:
      - main
      - claude/staging-branch-deployment-ow3zgc
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes to the same branch rather than racing them; two runs committing
# _site/ concurrently would conflict.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      # Guard against a build that silently produces nothing.
      - name: Sanity-check the output
        run: |
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          echo "Built $(find _site -type f | wc -l) files."

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  publish-staging:
    name: Commit output for Cloudflare
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Full history: the push below may need to rebase onto a moved branch,
          # which a depth-1 clone has no merge base for.
          fetch-depth: 0

      # Drop the committed output first: downloading the artifact over the top
      # would leave behind pages for posts that have since been deleted.
      - name: Clear the previous output
        run: rm -rf _site

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Commit if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # _site/ is gitignored, so --force is needed to stage new files;
          # --all picks up deletions.
          git add --all --force _site

          if git diff --cached --quiet; then
            echo "Output unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Rebuild site output for ${GITHUB_SHA::7}"
          # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot re-enter the build.

          # The branch can move while this job builds - another push, or a
          # commit made through the web UI - and a blind push then fails with a
          # non-fast-forward. Reconcile and retry instead of giving up: if the
          # rejected push were the last one, nothing would rebuild _site and
          # Cloudflare would keep serving the previous output indefinitely.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; the branch moved. Reconciling."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase FETCH_HEAD; then
              # Only reachable if something else rewrote _site meanwhile. That
              # commit has its own build run, so leave the rebuild to it rather
              # than guessing at a resolution.
              git rebase --abort
              echo "::warning::Could not rebase onto ${GITHUB_REF_NAME}; leaving the rebuild to the newer commit's run."
              exit 0
            fi
          done

          echo "::error::Could not push the rebuilt output after 3 attempts."
          exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
