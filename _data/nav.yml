# Single source of truth for the header dropdowns, the mobile drawer, the hub
# hero rails, and the footer sitemap.
#
# Per-child switches:
#   in_footer: false    omit from the footer column
#   footer_only: true   footer column only, not the dropdown or drawer
#   rail_only: true     hub hero rail only — off the dropdown, the drawer, and
#                       the footer, so the page stays reachable from its hub
#                       without being advertised sitewide
#   rail_url:           override the URL used by the hub hero rail button

- title: Home
  url: /

- title: Who We Help
  url: /who-we-help/
  footer_title: Who we help
  children:
    - title: People and Families
      url: /who-we-help/individuals/
      rail_only: true
    - title: Startups
      url: /who-we-help/startups/
      rail_only: true
    - title: Small Businesses
      url: /who-we-help/small-businesses/
    - title: Non-profits
      url: /who-we-help/nonprofits/
    - title: Public Sector
      url: /who-we-help/government/

- title: Expertise
  url: /expertise/
  drawer_title: Areas of Expertise
  footer_title: Expertise
  children:
    - title: Technical Support
      url: /expertise/technical-support/
    - title: "Training & Education"
      url: /expertise/education/
    - title: "Strategy & Operations"
      url: /expertise/advising/
      rail_only: true
    - title: Artificial Intelligence
      url: /expertise/artificial-intelligence/
    - title: Data Science
      url: /expertise/data-science/
    - title: Product and Engineering
      url: /expertise/product-and-engineering/

- title: How We Work
  url: /how-we-work/
