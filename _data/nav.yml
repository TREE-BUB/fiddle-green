# Single source of truth for the header dropdowns, the mobile drawer, the hub
# hero rails, and the footer sitemap.
#
# Per-child switches:
#   in_footer: false    omit from the footer column
#   footer_only: true   footer column only, not the dropdown or drawer
#   hidden: true        off every surface — the dropdown, the drawer, the hub
#                       rail, and the footer. The page stays live at its URL,
#                       but nothing on the site links to it
#   rail_url:           override the URL used by the hub hero rail button
#   blurb:              the line of copy under the child's name on its hub page.
#                       Who We Help and Services keep theirs in segments.yml
#                       and expertise.yml instead, beside the home-page icons

- title: Home
  url: /

- title: Who We Help
