# Copy for the three data-driven Who We Help sub-pages.
startups:
  cards_title: Where we usually come in
  cards:
    - h: Accounts and ownership
      p: Domains, email, and shared logins registered to the company — not to whoever set them up on a Tuesday.
    - h: Security that fits stage
      p: Two-factor, device basics, and access control at a level that won't slow a team of four down.
    - h: Tooling choices
      p: An honest read on what to buy, what to skip, and what you'll regret at twenty people.
    - h: AI, used carefully
      p: Where a model genuinely helps, where it leaks your data, and how to write a short internal policy.
  steps_note: Usually a couple of sessions, then we stay reachable.
  steps:
    - num: "01"
      h: A working session.
      p: Ninety minutes on what you have, what you plan, and where the sharp edges are.
    - num: "02"
      h: A short written plan.
      p: Prioritized, costed roughly, and readable by a non-technical cofounder or board member.
    - num: "03"
      h: We do the setup with you.
      p: Not for you — with you, so your team knows how it works once we're gone.
  cta_title: Need someone on call without a full-time hire?
  cta_body: Short-term and long-term engagements are both on the table. Rates are sliding-scale and quoted before any work starts.

businesses:
  cards_title: We help small businesses...
  cards:
    - h: Optimize existing technology
      p: We help you get the most out of the investments you've made in Microsoft 365, Google Workspace, and other tools. We also make sure your vendors deliver what they promised.
    - h: Explore AI and automation
      p: AI isn't magic, but with the right guidance it definitely can make you more efficient. We'll help you figure out where it actually makes sense for your business.
    - h: Get more value from data
      p: You already have valuable data. We work with you to benefit from the insights and value that's sitting in your systems right now.
    - h: Make the right investments
      p: Cut through the smoke and mirrors. We evaluate vendors, help you figure out ROI, and make sure you're spending money on what actually matters.
  steps_title: How we work with small businesses
  steps_grid: true
  steps_note: We work hard to provide the flexibility small businesses need. If you're thinking something else, let us know and we'll work together to find something that works.
  steps:
    - h: Needs Assessment
      p: Often the first step in our process. We perform a comprehensive evaluation of your current technology ecosystem and deliver an actionable set of recommendations.
    - h: Targeted Sprints
      p: Short-term, focused support to solve an immediate business need — such as vendor evaluation, staff training, or system setup.
    - h: Project Support
      p: End-to-end execution for specific business initiatives or technical projects, ranging from a few hours of work to a multi-month engagement.
    - h: Ongoing Partnership
      p: Following a brief onboarding, we provide continuous technical and strategic support to ensure your technology scales seamlessly with your business.
  cta_title: Want a number you can call on a bad day?
  cta_body: Hourly, short-term, and long-term arrangements are all available, with sliding-scale rates quoted when we talk.

nonprofits:
  cards_title: What we help with most
  cards:
    - h: Doing more with donated tools
      p: Nonprofit licensing, grant-funded hardware, and getting real value out of what you already have.
    - h: Volunteer-proof setups
      p: Systems that survive turnover, with documentation a new coordinator can follow.
    - h: Data and privacy
      p: Handling client and donor information carefully, in plain-language policies your board can approve.
    - h: Grant and funder support
      p: Scopes, quotes, and written assessments you can attach to an application or report.
  steps_note: Discounted rates are standard here, not a favor.
  steps:
    - num: "01"
      h: We learn the program.
      p: What you do, who you serve, and how technology currently helps or gets in the way.
    - num: "02"
      h: We write it down.
      p: A short assessment you can hand to a board, a funder, or your next hire.
    - num: "03"
      h: We work at your pace.
      p: Around grant cycles, seasonal programs, and the weeks when everyone is at an event.
  cta_title: Nonprofit discounts are built in.
  cta_body: We quote on a sliding scale and discount nonprofit work as a matter of policy. Ask and we will tell you exactly what your project would run.
